# Publica o app no GitHub Pages a cada push na main.
# Custo zero: o Pages serve arquivo estático, que é o que `nuxt generate` gera.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` e o que o proprio modelo do GitHub para Pages
# recomenda: cancelar uma publicacao no meio pode deixar o ambiente
# github-pages travado, e as seguintes ficam esperando ate estourar o tempo.
# Melhor deixar a atual terminar e enfileirar a proxima.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Endereco base do app, no NIVEL DO JOB de proposito.
    # Ja esteve so no passo do generate, e o passo que confere o service
    # worker rodava sem ela — lia a base como "/" e reprovava um build
    # correto, acusando escopo, manifesto e icones todos errados. Dois passos
    # lendo a mesma verdade de lugares diferentes e so questao de tempo ate
    # discordarem; declarada aqui, nao ha como.
    # O nome vem do proprio GitHub, entao renomear o repositorio nao quebra.
    # No dia do corte (dominio proprio), apagar estas duas linhas.
    env:
      NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

    steps:
      - uses: actions/checkout@v4
      # Sem `cache: npm` de proposito: o cache do setup-node procura um
      # package-lock.json para montar a chave e falha quando ele nao existe.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache proprio, com chave no package.json em vez do lock. Sem ele, cada
      # publicacao rebaixava os 868 pacotes do zero — mais de um minuto so ai.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      # `npm install` e nao `npm ci` de proposito: o ci exige um
      # package-lock.json perfeito e recusa qualquer divergencia. Como as
      # versoes diretas estao travadas exatas no package.json, o resultado e o
      # mesmo sem a fragilidade do arquivo de lock.
      - run: npm install --no-audit --no-fund

      # Regra do dossie virada em porta de build: frase sem os tres idiomas
      # nao passa daqui.
      - name: Conferir dicionarios
        run: npm run conferir:frases

      # Aponta texto de tela que ficou fora do dicionario. Nao derruba o build
      # de proposito: avisa no log, para nao travar entrega por causa de uma
      # frase nova. A varredura pega tambem os literais dentro de {{ }} — foi
      # o que faltava e deixou os botoes sem traducao.
      - name: Conferir textos das telas
        run: npm run conferir:textos

      # Compila cada .vue sozinho para dizer QUAL arquivo quebrou. O erro do
      # build diz "26 erros" e nao diz onde — procurar a mao em 51 telas ja
      # levou a consertar o arquivo errado.
      - name: Conferir telas
        run: npm run conferir:telas

      # A base vem do env do job, logo acima.
      - run: npm run generate

      # Agora que `app.baseURL` acompanha a subpasta, o Nuxt ja escreve a
      # casca em .output/public/index.html — sem a pasta aninhada que existia
      # antes e sem o `mv` que a desfazia. Aquele `mv` acontecia DEPOIS do
      # service worker ser gerado, e deixava o precache apontando para um
      # caminho que nao existia mais: uma entrada 404 aborta a instalacao
      # inteira do worker, e era por isso que o offline nunca funcionava.
      # So resta duplicar a casca como 404.html, que e o que faz o Pages
      # devolver o app em rota funda (/propriedades/123) no lugar do erro.
      # No dia do corte, este passo continua valendo.
      - name: Casca como pagina de erro do Pages
        run: |
          test -f .output/public/index.html \
            || { echo "casca HTML nao foi gerada - build invalido"; exit 1; }
          cp .output/public/index.html .output/public/404.html

      # Porta de build para a armadilha acima: se alguma entrada do precache
      # nao existir no disco, o worker nao instala e o app perde o offline sem
      # dar erro nenhum em tela. Melhor quebrar a publicacao aqui.
      - name: Conferir o precache do service worker
        run: node scripts/conferir-sw.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
